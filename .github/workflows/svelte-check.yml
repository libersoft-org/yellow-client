name: Svelte Check

on:
  push:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  svelte-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: "latest" makes the build depend on whatever bun released today.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Init
        run: bun run init

      - name: Buiild
        run: bun run build

      - name: Run svelte-check
        run: bun run svelte-check --fail-on-warnings
